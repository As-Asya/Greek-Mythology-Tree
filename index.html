<body>


<div id="layout">

    <!-- Граф -->
    <div id="cy"></div>

    <!-- Пошук персонажів -->
    <div id="search">

        <input
            id="searchInput"
            type="search"
            placeholder="Знайти персонажа..."
            autocomplete="off"
        />

        <div id="searchResults"></div>

    </div>

    <!-- Керування масштабом -->
    <div id="controls">

        <button
            id="zoomOutButton"
            title="Віддалити"
            type="button"
        >
            −
        </button>

        <button
            id="zoomInButton"
            title="Наблизити"
            type="button"
        >
            +
        </button>

        <button
            id="fitButton"
            title="Показати все дерево"
            type="button"
        >
            ⌂
        </button>

    </div>

    <!-- Бокова картка -->
    <aside id="info">

        <h2>Оберіть персонажа</h2>

        <p>
            Натисніть на будь-якого персонажа
            на дереві
        </p>

    </aside>

</div>

    type="module"
    src="/src/main.js"
></script>
