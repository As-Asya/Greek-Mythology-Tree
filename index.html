<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Greek Mythology Tree
    </title>
</head>

<body>

    <div id="layout">

        <!-- =========================
        ГРАФ
        ========================= -->

        <div id="cy"></div>


        <!-- =========================
        ПОШУК
        ========================= -->

        <div id="search">

            <input
                id="searchInput"
                type="search"
                placeholder="Знайти персонажа..."
                autocomplete="off"
            >

            <div id="searchResults"></div>

        </div>


        <!-- =========================
        КНОПКИ КЕРУВАННЯ
        ========================= -->

        <div id="controls">

            <button
                id="zoomOutButton"
                type="button"
                aria-label="Віддалити"
            >
                −
            </button>

            <button
                id="zoomInButton"
                type="button"
                aria-label="Наблизити"
            >
                +
            </button>

            <button
                id="fitButton"
                type="button"
                aria-label="Показати все дерево"
            >
                ⌂
            </button>

            <button
                id="compareButton"
                type="button"
                aria-label="Порівняти родоводи"
                aria-pressed="false"
            >
                ⇄
            </button>

        </div>


        <!-- =========================
        ІНФОРМАЦІЙНА ПАНЕЛЬ
        ========================= -->

        <aside id="info">

            <div class="info-drag-handle"></div>

            <button
                id="closeInfoButton"
                type="button"
                aria-label="Закрити панель"
            >
                ×
            </button>

            <p>
                Оберіть персонажа
            </p>

        </aside>

    </div>


    <script
        type="module"
        src="/src/main.js"
    ></script>

</body>
</html>
